[package]
name = "semprox"
version = "0.1.0"
edition = "2021"
description = "High-performance OpenAI-compatible semantic caching reverse proxy with local vector embeddings"
readme = "README.md"
repository = "https://github.com/abnv16/semprox"
homepage = "https://github.com/abnv16/semprox"
keywords = ["openai", "semantic-cache", "proxy", "llm", "fastembed"]
categories = ["network-programming", "web-programming::http-server", "science"]

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-stream = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream"
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

dashmap = "6"
parking_lot = "0.12"
fastembed = "4"

prometheus = "0.13"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json"
] }

sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
bytes = "1"
http = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
